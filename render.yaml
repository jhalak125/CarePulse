services:
  # Python FastAPI Backend Web Service
  - type: web
    name: carepulse-backend
    env: python
    region: singapore
    buildCommand: "pip install -r server/requirements.txt && python server/seed.py"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        value: "sqlite:///./dev.db"
      - key: JWT_SECRET
        value: "super_secret_healthcare_jwt_key_2026_pulse_secure"
      - key: CLIENT_URL
        value: "https://carepulse-web.onrender.com"

  # React Vite Frontend Static Site
  - type: static
    name: carepulse-web
    buildCommand: "cd client && npm install && npm run build"
    staticPublishPath: "./client/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
